<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Thank you for your order from Mama Made Studio — your downloads are ready.">
  <meta name="theme-color" content="#fff8ec">
  <title>Thank you · Mama Made Studio</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="/assets/success.js"></script>
  <script defer src="/assets/signup.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">🌼</span>
      <span>Mama Made Studio</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">ORDER CONFIRMED</p>
      <h1 id="status-heading">Checking your order…</h1>
      <p id="status-copy">One moment while we confirm your payment.</p>
    </section>
    <section class="section">
      <div id="downloads" class="product-grid downloads-grid"></div>
    </section>
  </main>

  <footer>
    <div>
      <strong>Mama Made Studio</strong>
      <p class="muted">Questions about your order? Just reply to your receipt email.</p>
    </div>
    <form class="signup" data-signup>
      <label for="signup-email"><strong>Get new designs &amp; freebies</strong></label>
      <div class="signup-row">
        <input id="signup-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <button class="add-btn" type="submit">Subscribe</button>
      </div>
      <p class="muted signup-msg" role="status"></p>
    </form>
  </footer>

</body>
</html>
