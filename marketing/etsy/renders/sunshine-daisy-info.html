<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800;900&display=swap" rel="stylesheet"><style>

li{background:#fffdf9;border:0.0625vmin solid rgba(74,60,51,.14);border-radius:1.2500vmin;padding:2.5000vmin;font-size:2.1250vmin;font-weight:800;color:#4a3c33;display:flex;align-items:center;gap:1.5000vmin}

</style></head><body>

  <h1>Sunshine Daisy Sticker Sheet</h1>

    <li><span>🖨️</span> Print-at-Home Sticker</li>

  </ul>
</div>
</body></html>
