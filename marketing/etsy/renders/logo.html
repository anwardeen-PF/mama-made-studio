<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet"><style>
html,body{margin:0;width:100vw;height:100vh;background:#fff8ec;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
.wrap{width:80vmin;height:80vmin;border-radius:50%;background:#fff8ec;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0.8vmin solid #f6b94d}
.mark{width:34vmin;height:34vmin}
.name{font-size:6.2vmin;font-weight:900;color:#4a3c33;letter-spacing:-0.1vmin;margin-top:2vmin}
</style></head><body>
<div class="wrap">
  <svg class="mark" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(200,210)">
      <g fill="#fff3c4" stroke="#f3cf6b" stroke-width="6">
        <ellipse rx="56" ry="110" transform="rotate(0)"/>
        <ellipse rx="56" ry="110" transform="rotate(45)"/>
        <ellipse rx="56" ry="110" transform="rotate(90)"/>
        <ellipse rx="56" ry="110" transform="rotate(135)"/>
      </g>
      <circle r="80" fill="#f6b94d" stroke="#e39b2b" stroke-width="6"/>
      <g fill="#5a4632">
        <circle cx="-27" cy="-8" r="9"/>
        <circle cx="27" cy="-8" r="9"/>
        <path d="M -29 24 Q 0 48 29 24" fill="none" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
      </g>
      <circle cx="-36" cy="22" r="12" fill="#f6a4a1" opacity=".7"/>
      <circle cx="36" cy="22" r="12" fill="#f6a4a1" opacity=".7"/>
    </g>
  </svg>
  <div class="name">Mama Made</div>
</div>
</body></html>
