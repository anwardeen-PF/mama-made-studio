<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;background:#efe9df;font-family:Georgia,serif}
.wall{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.shadow{position:absolute;width:57.5000vmin;height:57.5000vmin;background:rgba(0,0,0,.10);border-radius:0.5000vmin;transform:translate(1.6250vmin,2.1250vmin);filter:blur(1.1250vmin)}
.frame{position:relative;width:56.2500vmin;height:56.2500vmin;background:#2c2621;padding:1.6250vmin;border-radius:0.2500vmin;box-shadow:0 0.1250vmin 0 rgba(255,255,255,.08) inset}
.mat{width:100%;height:100%;background:#fdfaf4;padding:4.3750vmin;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.art{width:100%;height:100%}
.shelf{position:absolute;bottom:10.6250vmin;left:0;right:0;height:0.8750vmin;background:#d8cdbb}
.leaf{position:absolute;bottom:11.5000vmin;left:18.7500vmin;width:3.7500vmin;height:5.6250vmin;background:#9fb98f;border-radius:0 100% 0 100%;transform:rotate(-12deg)}
</style></head><body>
<div class="wall">
  <div class="shelf"></div>
  <div class="leaf"></div>
  <div class="shadow"></div>
  <div class="frame"><div class="mat">
    <svg class="art" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#eef7fb"/>
      <g transform="translate(60,150)">
        <path d="M0 80 Q 20 10 140 0 Q 260 -6 300 60 Q 260 70 240 50 Q 230 90 180 95 Q 100 102 40 110 Q 10 110 0 80 Z" fill="#9cc9e0" stroke="#6fa9c8" stroke-width="5"/>
        <path d="M160 -2 Q 185 -40 215 -4 Q 195 4 180 10 Z" fill="#9cc9e0" stroke="#6fa9c8" stroke-width="5"/>
        <circle cx="95" cy="45" r="8" fill="#3d4d55"/>
        <circle cx="60" cy="62" r="14" fill="#f6a4a1" opacity=".7"/>
        <path d="M250 10 Q 258 -14 268 10" fill="none" stroke="#bfe3f0" stroke-width="6" stroke-linecap="round"/>
        <path d="M266 6 Q 276 -22 288 8" fill="none" stroke="#bfe3f0" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g fill="#f3cf6b">
        <path d="M90 90 l5 12 12 2 -9 8 3 12 -11 -6 -11 6 3 -12 -9 -8 12 -2z"/>
        <path d="M330 260 l4 9 9 2 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -2z"/>
      </g>
    </svg>
  </div></div>
</div>
</body></html>
